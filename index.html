<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="只用于保存阅读中遇到的英语生词和短语。">
  <title>阅读生词</title>
  <link rel="manifest" href="./manifest.json?v=3.0.0">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css?v=3.0.0">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Reading Vocabulary</p>
        <h1>阅读生词</h1>
        <p class="subtitle">只记录阅读中真正遇到的单词、短语和原句。</p>
      </div>
      <div class="count-card" aria-label="已保存词条数">
        <strong id="wordCount">0</strong>
        <span>已保存</span>
      </div>
    </header>

    <section class="card form-card" aria-labelledby="saveTitle">
      <div class="section-heading">
        <h2 id="saveTitle">保存生词</h2>
        <span>同一词条再次保存会更新内容并累计遇见次数</span>
      </div>

      <form id="wordForm" class="word-form" autocomplete="off">
        <label>
          <span>单词 / 短语 <b>*</b></span>
          <input id="term" name="term" type="text" placeholder="例如 susceptible to" required autofocus>
        </label>

        <label>
          <span>中文义</span>
          <input id="meaning" name="meaning" type="text" placeholder="例如 易受……影响">
        </label>

        <label>
          <span>来源</span>
          <input id="source" name="source" type="text" placeholder="例如 六级阅读 Passage Two">
        </label>

        <label>
          <span>原句</span>
          <textarea id="sentence" name="sentence" rows="3" placeholder="把阅读中的原句粘贴到这里"></textarea>
        </label>

        <label>
          <span>备注</span>
          <textarea id="note" name="note" rows="2" placeholder="可选：搭配、易混点等"></textarea>
        </label>

        <button id="saveButton" class="primary-button" type="submit">保存</button>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="saved-section" aria-labelledby="savedTitle">
      <div class="section-heading list-heading">
        <h2 id="savedTitle">已保存生词</h2>
      </div>
      <div id="wordList" class="word-list"></div>
    </section>
  </main>

  <script src="./db.js?v=3.0.0"></script>
  <script src="./app.js?v=3.0.0"></script>
</body>
</html>
